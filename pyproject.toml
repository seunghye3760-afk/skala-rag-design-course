[project]
name = "kv-eval"
version = "0.1.0"
description = "KV cache 최적화 기술(TurboQuant·CXL-PNM) 다관점 평가 Agentic RAG"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tavily-python>=0.5",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pypdf>=4.2",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "markdown>=3.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kv_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
