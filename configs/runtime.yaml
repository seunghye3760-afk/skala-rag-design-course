# 실행 설정 (팀 공통). 개인 실험 값은 커밋하지 말 것.
llm:
  provider: openai
  model: "gpt-5.5"     # 이 키에서 쓸 수 있는 최상위 텍스트 채팅 모델 (2026-09-22 models.list 기준)
  temperature: 0

embedding:
  model: BAAI/bge-m3   # 최종 확정은 eval/retrieval 결과로 (설계서 B-4 (6))
  device: cpu

retrieval:
  top_k: 5
  fusion: rrf          # FAISS(dense) + BM25(sparse) 순위 결합
  candidate_k: 20      # 결합 전 각 검색기에서 가져오는 후보 수
  rrf_k: 60            # RRF 상수 (LangChain EnsembleRetriever 기본값과 같음)
  weights: [0.5, 0.5]  # [BM25, dense]. 20문항으로 튜닝하지 않음 (과적합 방지)

chunk:
  max_chars: 1200      # ≈ 300토큰. e5 512토큰 제한 안 → 세 후보를 같은 청크로 비교 (설계서 B-4 (6))
  overlap_chars: 200   # 같은 절·쪽 안에서만 앞 청크 끝 문장을 겹침

web_search:
  max_results: 5       # 두 기술에 동일 (설계서 C-5 검색 규칙)
  period_from: "2025-01-01"

retry:
  max_rounds: 2        # 균형 점검 재시도 최대 라운드 (retry_round)
  query_rewrite_max: 1 # 수집 단계 쿼리 재작성 (항목당)

cache_dir: .cache      # 검색 캐시 (재현성·API 사용량 절감)

# ---- Orchestrator-Workers (app_agent.py / src/kv_eval/orchestrator) ----
fallback:
  worker_retry: 1      # worker 예외 시 같은 입력으로 재시도 횟수
  on_failure: exclude  # 재시도 소진: 수집 셀은 제외(info_gap 기록), 채점 항목은 NA

concurrency:
  max_concurrency: 8   # Send 병렬 worker 동시 실행 상한 (Tavily·OpenAI rate limit 기준)

quality:
  max_rounds: 2        # evaluate_report 횟수 상한 — 도달 시 미달 항목을 기록하고 정상 종료
  judge_threshold: 4   # LLM Judge 4항목 통과 임계 (1~5)
  max_pages: 10        # 보고서 PDF 쪽수 상한 — 초과 시 finalize가 부록을 appendix.md로 분리

limits:
  recursion_limit: 150 # LangGraph 슈퍼스텝 상한 (안전장치; 정상 실행은 수십 스텝)
