# 실행 설정 (팀 공통). 개인 실험 값은 커밋하지 말 것.
llm:
  provider: openai
  model: "gpt-5.5"     # 이 키에서 쓸 수 있는 최상위 텍스트 채팅 모델 (2026-09-22 models.list 기준)
  temperature: 0

embedding:
  model: BAAI/bge-m3   # 최종 확정은 eval/retrieval 결과로 (설계서 B-4 (6))
  device: cpu

retrieval:
  top_k: 5
  fusion: rrf          # FAISS(dense) + BM25(sparse) 순위 결합
  candidate_k: 20      # 결합 전 각 검색기에서 가져오는 후보 수
  rrf_k: 60            # RRF 상수 (LangChain EnsembleRetriever 기본값과 같음)
  weights: [0.5, 0.5]  # [BM25, dense]. 20문항으로 튜닝하지 않음 (과적합 방지)

chunk:
  max_chars: 1200      # ≈ 300토큰. e5 512토큰 제한 안 → 세 후보를 같은 청크로 비교 (설계서 B-4 (6))
  overlap_chars: 200   # 같은 절·쪽 안에서만 앞 청크 끝 문장을 겹침

web_search:
  max_results: 5       # 두 기술에 동일 (설계서 C-5 검색 규칙)
  period_from: "2025-01-01"

retry:
  max_rounds: 2        # 균형 점검 재시도 최대 라운드 (retry_round)
  query_rewrite_max: 1 # 수집 단계 쿼리 재작성 (항목당)

orchestrator:
  max_subtasks_per_round: 80   # 라운드당 Worker 상한 (셀 36 × 채널 최대 3 = 108 → 선택 채널부터 제외)
  worker_max_attempts: 2       # Worker 예외 시 재시도 포함 총 시도 수. 소진되면 excluded로 기록하고 계속
  max_control_steps: 20        # 조정 노드(plan·balance·quality) 통과 총 상한 — 넘으면 루프 대신 마무리 경로
  recursion_limit: 200         # LangGraph 슈퍼스텝 상한 (마지막 안전망)

quality:                       # 보고서 품질 평가 (Hybrid: 규칙 + LLM Judge)
  max_rounds: 2                # 미달 시 재계획/재작성 루프 상한. 소진되면 판정만 기록하고 종료
  judge: true                  # false면 규칙 검사만 (1안)
  judge_pass_score: 3          # 1~5. 이 점수 미만 + 검증된 위반 문장이 있을 때만 축 실패
  min_cells_for_distribution: 4   # 편향: 점수 있는 셀이 이보다 적은 기술은 분포 판정 생략 (표본 부족)
  min_publishers_per_tech: 3   # 편향: 기술별 인용 근거의 발행 주체 수 하한
  max_publisher_share: 0.5     # 편향: 단일 발행 주체 비중 상한
  min_con_share: 0.2           # 편향: 비판(con) 근거 비중 하한
  min_cited_ratio_between_techs: 0.5   # 편향: 두 기술 인용 근거 수 비율 하한 (같은 강도로 조사)

cache_dir: .cache      # 검색 캐시 (재현성·API 사용량 절감)
